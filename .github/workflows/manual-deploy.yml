name: Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install

      - name: Configure Cloudflare auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_OAUTH_TOKEN: ${{ secrets.CLOUDFLARE_OAUTH_TOKEN || '' }}
          CLOUDFLARE_OAUTH_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_OAUTH_REFRESH_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Using CLOUDFLARE_API_TOKEN for Wrangler auth."
            exit 0
          fi

          if [[ -z "${CLOUDFLARE_OAUTH_TOKEN}" || -z "${CLOUDFLARE_OAUTH_REFRESH_TOKEN}" ]]; then
            echo "Missing Cloudflare credentials."
            echo "Set CLOUDFLARE_API_TOKEN or both CLOUDFLARE_OAUTH_TOKEN and CLOUDFLARE_OAUTH_REFRESH_TOKEN."
            exit 1
          fi

          export XDG_CONFIG_HOME="${RUNNER_TEMP}/xdg.config"
          mkdir -p "${XDG_CONFIG_HOME}/.wrangler/config"
          cat > "${XDG_CONFIG_HOME}/.wrangler/config/default.toml" <<EOF
oauth_token = "${CLOUDFLARE_OAUTH_TOKEN}"
expiration_time = "1970-01-01T00:00:00.000Z"
refresh_token = "${CLOUDFLARE_OAUTH_REFRESH_TOKEN}"
EOF
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME}" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          DB_NAME: ${{ vars.DB_NAME }}
          NAME: ${{ vars.NAME }}
          DESCRIPTION: ${{ vars.DESCRIPTION || 'A lightweight personal blogging system' }}
          AVATAR: ${{ vars.AVATAR || '' }}
          PAGE_SIZE: ${{ vars.PAGE_SIZE || '5' }}
          RSS_ENABLE: ${{ vars.RSS_ENABLE || 'false' }}
          S3_CACHE_FOLDER: ${{ vars.S3_CACHE_FOLDER || 'cache/' }}
          S3_FOLDER: ${{ vars.S3_FOLDER || 'images/' }}
          S3_REGION: ${{ vars.S3_REGION || 'auto' }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE || 'false' }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || '' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT || '' }}
          S3_ACCESS_HOST: ${{ vars.S3_ACCESS_HOST || '' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || '' }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID || '' }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY || '' }}
          RIN_GITHUB_CLIENT_ID: ${{ secrets.RIN_GITHUB_CLIENT_ID || '' }}
          RIN_GITHUB_CLIENT_SECRET: ${{ secrets.RIN_GITHUB_CLIENT_SECRET || '' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL || '' }}
          RSS_TITLE: ${{ vars.RSS_TITLE || '' }}
          RSS_DESCRIPTION: ${{ vars.RSS_DESCRIPTION || '' }}
          CACHE_STORAGE_MODE: ${{ vars.CACHE_STORAGE_MODE || 's3' }}
        run: bun run deploy
